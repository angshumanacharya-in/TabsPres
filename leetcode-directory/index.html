<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Solutions Directory & Algorithm Guide | Tabspace</title>
    
    <!-- SEO Meta Tags[cite: 1] -->
    <meta name="description" content="Explore optimized, step-by-step LeetCode algorithmic solutions categorized by difficulty and computer science topics like Dynamic Programming, Graphs, and Trees.">
    <link rel="canonical" href="https://tabspacepresentations.com/leetcode-directory/" />

    <!-- Open Graph (Social Sharing)[cite: 1] -->
    <meta property="og:title" content="LeetCode Solutions Directory | Tabspace" />
    <meta property="og:description" content="An exhaustive directory of LeetCode algorithmic solutions categorized by difficulty and topic." />
    <meta property="og:url" content="https://tabspacepresentations.com/leetcode-directory/" />
    <meta property="og:type" content="website" />

    <!-- Schema.org Structured Data for SEO[cite: 1] -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "LeetCode Solutions Directory & Algorithm Guide",
      "url": "https://tabspacepresentations.com/leetcode-directory/",
      "description": "Explore optimized, step-by-step LeetCode algorithmic solutions categorized by difficulty and computer science topics."
    }
    </script>

    <!-- Tailwind CSS CDN[cite: 1, 2] -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            orange: '#ff6D00',
                            green: '#22c55e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .font-calisto {
            font-family: 'Calisto MT', 'Bookman Old Style', Georgia, serif;
        }

        :root {
            --bg-main: #1a1a1a;
            --bg-card: #2a2a2a;
            --border-color: #333333;
            --text-main: #eff1f5;
            --text-muted: #9ca3af;
            --accent-green: #22c55e;
            --glow-orange: #ff6D00;
        }

        /* Global Font Weight[cite: 2] */
        * {
            font-weight: 700 !important;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            letter-spacing: 0.025em;
        }

        /* Base Card & Nav Button Styles[cite: 2] */
        .card-section, .btn-card {
            background-color: rgba(39, 39, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* STANDARD HOVER: Text turns GREEN (#22c55e), Glow & Border turn ORANGE (#ff6d00)[cite: 2] */
        .std-hover {
            transition: all 0.25s ease-in-out;
        }
        .std-hover:hover h2, 
        .std-hover:hover h3, 
        .std-hover:hover span:not(.no-hover-override):not(.arrow):not(.preserve-white):not(.preserve-orange):not(.preserve-green) {
            color: var(--accent-green) !important;
        }
        
        .std-hover:hover .preserve-white {
            color: #ffffff !important;
        }
        .std-hover:hover .preserve-orange {
            color: #ff6D00 !important;
        }
        .std-hover:hover .preserve-green {
            color: #22c55e !important;
        }

        .std-hover:hover {
            border-color: var(--glow-orange) !important;
            box-shadow: 0 0 16px 2px rgba(255, 109, 0, 0.45) !important;
        }

        /* Solution Card Hover[cite: 1, 2] */
        .solution-card-hover {
            transition: all 0.25s ease-in-out;
        }
        .solution-card-hover:hover {
            border-color: var(--glow-orange) !important;
            box-shadow: 0 0 16px 2px rgba(255, 109, 0, 0.45) !important;
            background-color: #0c0a09;
        }
        .solution-card-hover:hover span {
            color: var(--accent-green) !important;
        }

        /* Custom Orange CTA Buttons[cite: 2] */
        .cta-btn-orange {
            background: linear-gradient(135deg, #ff6D00 0%, #ff8500 100%);
            color: #000000 !important;
            border: 1px solid #ff6D00;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 109, 0, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .cta-btn-orange:hover {
            background: #121212 !important;
            color: var(--accent-green) !important;
            border-color: var(--glow-orange) !important;
            box-shadow: 0 0 22px 4px rgba(255, 109, 0, 0.6) !important;
            transform: translateY(-2px) scale(1.03);
        }

        .arrow {
            display: inline-block;
            transition: transform 0.2s ease, color 0.25s ease;
            color: #000000 !important;
        }

        .cta-btn-orange:hover .arrow {
            color: var(--accent-green) !important;
            transform: translateY(3px);
        }

        .typing-cursor {
            display: inline-block;
            width: 3px;
            background-color: #22c55e;
            animation: blink 0.7s infinite;
            margin-left: 2px;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Custom Scrollbar[cite: 2] */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--glow-orange);
        }
    </style>

    <!-- Global problem array initialization[cite: 1] -->
    <script>
        window.rawProblems = [];
    </script>

    <!-- Problem Batches imported from external JS files[cite: 1] -->
    <script src="./problems/problems1to250.js"></script>
    <script src="./problems/problems251to500.js"></script>
    <script src="./problems/problems501to750.js"></script>
    <script src="./problems/problems751to1000.js"></script>
    <script src="./problems/problems1001to1250.js"></script>
    <script src="./problems/problems1251to1500.js"></script>
    <script src="./problems/problems1501to1750.js"></script>
    <script src="./problems/problems1751to2000.js"></script>
    <script src="./problems/problems2001to2250.js"></script>
    <script src="./problems/problems2251to2500.js"></script>
    <script src="./problems/problems2501to2750.js"></script>
    <script src="./problems/problems2751to3000.js"></script>
    <script src="./problems/problems3001to3250.js"></script>
    <script src="./problems/problems3251to3500.js"></script>
    <script src="./problems/problems3501to3750.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-calisto antialiased min-h-screen selection:bg-brand-orange selection:text-black flex flex-col justify-between">

    <!-- Header[cite: 1, 2] -->
    <header class="sticky top-0 z-50 bg-black border-b border-zinc-900 px-6 py-4 transition-all">
        <div class="w-full flex items-center justify-between gap-4 max-w-[1400px] mx-auto">
            <!-- Logo Container (Non-clickable, zoom on hover only) -->
            <div class="flex items-center gap-3 select-none">
                <div class="flex items-center shrink-0 py-1 cursor-default" aria-label="Tabspace Logo Container">
                    <img src="./logo.png" alt="Tabspace Logo" class="h-16 md:h-20 w-auto object-contain block opacity-95 hover:opacity-100 hover:scale-105 transition-all duration-300" />
                </div>
                <span class="text-zinc-500 text-lg md:text-2xl font-light">/ LeetCode Directory</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area[cite: 1, 2] -->
    <main class="w-full max-w-[1400px] mx-auto px-6 py-12 space-y-12 flex-grow">

        <!-- Hero Section[cite: 1, 2] -->
        <section class="card-section std-hover p-8 md:p-14 text-center flex flex-col items-center justify-center space-y-6">
            <h1 class="text-3xl md:text-5xl lg:text-6xl tracking-tight leading-tight">
                <span class="preserve-white" style="color: #ffffff;">Welcome to</span> <span class="preserve-orange" style="color: #ff6D00;">Tabspace</span> <span class="preserve-green" style="color: #22c55e;">Solutions</span>
            </h1>
            <div class="text-xl md:text-3xl text-zinc-300 font-medium h-12 flex items-center justify-center">
                <span id="typingSubtitle" class="text-zinc-300 transition-colors duration-200"></span><span class="typing-cursor" id="typingCursor">&nbsp;</span>
            </div>
            <p class="text-zinc-400 text-sm md:text-base max-w-2xl">
                Explore optimized, step-by-step LeetCode algorithmic solutions categorized by difficulty and computer science topics.
            </p>
        </section>

        <!-- Search Controls[cite: 1] -->
        <section class="max-w-xl mx-auto space-y-2">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by ID, title, or topic (e.g. Backtracking, 25, Binary Search)..." 
                onkeyup="handleSearch()"
                class="w-full px-5 py-3.5 bg-zinc-900/60 border border-zinc-800 rounded-xl text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-brand-orange transition-all font-calisto font-bold shadow-inner"
            >
            <div id="statsText" class="text-right text-xs text-zinc-500 font-calisto font-bold">Loading solutions...</div>
        </section>

        <!-- Problem Cards Grid (Single Column Layout with expanded width via max-w-5xl)[cite: 1, 2] -->
        <noscript>
            <div class="p-4 mb-6 bg-yellow-500/10 border border-yellow-500/20 text-yellow-200 text-sm rounded-xl font-calisto font-bold text-center">
                JavaScript is disabled. Please use your XML sitemap or browse individual pages directly via search engines.
            </div>
        </noscript>
        <div class="flex flex-col gap-4 max-w-5xl mx-auto" id="problemGrid"></div>

        <!-- Load More Button with Down Arrow[cite: 1] -->
        <div class="text-center pt-4">
            <button 
                id="loadMoreBtn" 
                onclick="loadNextBatch()" 
                class="hidden cta-btn-orange px-8 py-3.5 text-base active:scale-95 font-calisto font-bold inline-flex items-center gap-2"
            >
                Load More <span class="arrow">↓</span>
            </button>
        </div>

    </main>

    <!-- Footer[cite: 1, 2] -->
    <footer class="py-8 border-t border-zinc-900 text-center mt-12">
        <p class="text-xs tracking-wider text-zinc-500">
            Presented by <span class="font-bold text-[#ff6D00]">Tabspace</span> <span class="font-bold text-brand-green">Presentations</span> &copy; 2026. All rights reserved.
        </p>
    </footer>

    <!-- Rendering & Typing Script[cite: 1] -->
    <script>
        let words = [];
        let i = 0;
        let isTypingInitialized = false;

        function initDynamicTyping() {
            if (Array.isArray(window.rawProblems) && window.rawProblems.length > 0) {
                words = window.rawProblems.slice(0, 10).map(p => `${p.title}`);
                if (words.length > 0 && !isTypingInitialized) {
                    isTypingInitialized = true;
                    typingEffect();
                }
            }
        }

        function typingEffect() {
            if (words.length === 0) return;
            const word = words[i].split("");
            var loopTyping = function() {
                if (word.length > 0) {
                    document.getElementById('typingSubtitle').innerHTML += word.shift();
                } else {
                    setTimeout(deletingEffect, 2000);
                    return;
                }
                setTimeout(loopTyping, 70);
            };
            loopTyping();
        }

        function deletingEffect() {
            if (words.length === 0) return;
            const word = words[i].split("");
            var loopDeleting = function() {
                if (word.length > 0) {
                    word.pop();
                    document.getElementById('typingSubtitle').innerHTML = word.join("");
                } else {
                    i = (i + 1) % words.length;
                    setTimeout(typingEffect, 500);
                    return;
                }
                setTimeout(loopDeleting, 35);
            };
            loopDeleting();
        }

        let filteredProblems = Array.isArray(window.rawProblems) ? [...window.rawProblems] : [];
        let currentIndex = 0;
        const BATCH_SIZE = 150;

        function getDiffBadgeClass(diff) {
            if (diff === 'Easy') return 'text-brand-green bg-green-500/10 border-green-500/20';
            if (diff === 'Medium') return 'text-yellow-500 bg-yellow-500/10 border-yellow-500/20';
            return 'text-red-500 bg-red-500/10 border-red-500/20';
        }

        function renderNextBatch(reset = false) {
            const grid = document.getElementById('problemGrid');
            const btn = document.getElementById('loadMoreBtn');
            const stats = document.getElementById('statsText');

            if (reset) {
                grid.innerHTML = '';
                currentIndex = 0;
            }

            const nextBatch = filteredProblems.slice(currentIndex, currentIndex + BATCH_SIZE);
            
            const html = nextBatch.map(p => `
                <a href="./solutions/${p.slug}/" class="card-section solution-card-hover p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 w-full text-left group">
                    <div class="flex items-start gap-2">
                        <span class="text-sm md:text-base font-semibold">
                            <span class="text-zinc-300">${p.id}. </span><span class="group-hover:text-brand-green transition-colors">${p.title}</span>
                        </span>
                    </div>
                    <div class="flex items-center justify-between sm:justify-end gap-4 shrink-0">
                        <span class="text-xs text-zinc-500 font-calisto font-bold max-w-md truncate">
                            <span class="text-zinc-600 font-medium">Topics:</span> ${p.topics}
                        </span>
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-md border shrink-0 font-calisto font-bold ${getDiffBadgeClass(p.diff)}">
                            ${p.diff}
                        </span>
                    </div>
                </a>
            `).join('');

            grid.insertAdjacentHTML('beforeend', html);
            currentIndex += BATCH_SIZE;

            stats.innerText = `Showing ${Math.min(currentIndex, filteredProblems.length)} of ${filteredProblems.length} solutions`;
            btn.style.display = currentIndex >= filteredProblems.length ? 'none' : 'inline-flex';
        }

        function loadNextBatch() {
            renderNextBatch(false);
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (Array.isArray(window.rawProblems)) {
                filteredProblems = window.rawProblems.filter(p => {
                    const fullText = `${p.id}. ${p.title} ${p.topics}`.toLowerCase();
                    return fullText.includes(query);
                });
            }

            renderNextBatch(true);
        }

        window.addEventListener('DOMContentLoaded', () => {
            filteredProblems = Array.isArray(window.rawProblems) ? [...window.rawProblems] : [];
            renderNextBatch(true);
            initDynamicTyping();
        });

        setTimeout(() => {
            if (!isTypingInitialized) {
                initDynamicTyping();
            }
        }, 300);
    </script>
</body>
</html>
