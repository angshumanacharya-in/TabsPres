<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Dictionary - Computer Science Concepts & Terms | Tabspace Presentations</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Explore the CS Dictionary on Tabspace Presentations for comprehensive definitions of computer science terms, coding concepts, algorithms, and technical jargon starting with 0-9.">
    <meta name="keywords" content="CS Dictionary, Computer Science Terms, Coding Concepts, Tabspace Presentations, Programming Dictionary">
    <link rel="canonical" href="https://tabspacepresentations.com/cs-dictionary">

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="CS Dictionary - Computer Science Concepts & Terms">
    <meta property="og:description" content="Explore comprehensive definitions of computer science terms, coding concepts, and technical jargon starting with 0-9.">
    <meta property="og:url" content="https://tabspacepresentations.com/cs-dictionary">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="style.css">

    <script src="words/data-num.js"></script>
    <script src="words/data-A.js"></script>
    <script src="words/data-B.js"></script>
    <script src="words/data-C.js"></script>
    <script src="words/data-D.js"></script>
    <script src="words/data-E.js"></script>
    <script src="words/data-F.js"></script>
    <script src="words/data-G.js"></script>
    <script src="words/data-H.js"></script>
    <script src="words/data-I.js"></script>
    <script src="words/data-J.js"></script>
    <script src="words/data-K.js"></script>
    <script src="words/data-L.js"></script>
    <script src="words/data-M.js"></script>
    <script src="words/data-N.js"></script>
    <script src="words/data-O.js"></script>
    <script src="words/data-P.js"></script>
    <script src="words/data-Q.js"></script>
    <script src="words/data-R.js"></script>
    <script src="words/data-S.js"></script>
    <script src="words/data-T.js"></script>
    <script src="words/data-U.js"></script>
    <script src="words/data-V.js"></script>
    <script src="words/data-W.js"></script>
    <script src="words/data-X.js"></script>
    <script src="words/data-Y.js"></script>
    <script src="words/data-Z.js"></script>

    <script src="script.js" defer></script>
</head>
<body>

    <header class="global-header">
        <div class="logo-area">
            <button class="logo-toggle-btn" id="sidebarToggleBtn" title="Toggle Sidebar Index Menu">
                <img src="logo.png" alt="Tabspace Logo" class="logo-img" onerror="this.style.border='1px dashed #333'; this.style.padding='4px';">
            </button>
            <span class="logo-separator">/</span>
            <span class="logo-label" style="font-weight: bold;">CS Dictionary</span>
        </div>
    </header>

    <div class="app-workspace">
        <aside id="sidebarPanel">
            <div class="sidebar-title">Index Pages</div>
            <nav class="alpha-grid" id="navigationGrid">
                <button class="alpha-btn num-btn active" data-page="0-9">0-9</button>
            </nav>
        </aside>

        <main>
            <div class="top-toolbar">
                <h1 class="page-context-title" id="pageTitle">0-9 <span id="itemCount">(0 terms)</span></h1>
                
                <div class="search-wrapper">
                    <input type="text" id="dashboardSearch" class="search-input" placeholder="Search topics or descriptions...">
                </div>
            </div>

            <div class="list-container" id="listContainer">
                <div class="list-header" id="listHeader">
                    <div>Topic Name</div>
                    <div>Definition / Conceptual Breakdown</div>
                </div>
                
                <div id="itemsWrapper" style="display: contents;"></div>

                <div id="tableEmptyState" class="empty-state">
                    No matching CS topics found inside this dynamic search scope.
                </div>
            </div>
        </main>
    </div>

    <!-- Initialization Script forcing 0-9 scope load immediately -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Check common function names used in dashboard/dictionary scripts to load 0-9 data natively
            setTimeout(() => {
                if (typeof selectCategory === "function") {
                    selectCategory("0-9");
                } else if (typeof renderCategory === "function") {
                    renderCategory("0-9");
                } else if (typeof loadCategory === "function") {
                    loadCategory("0-9");
                } else {
                    const numBtn = document.querySelector('.num-btn');
                    if (numBtn) numBtn.click();
                }
            }, 50);
        });
    </script>

</body>
</html>
